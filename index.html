<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de audio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Reproductor de audio</h1>

  <div class="players">
    <div class="player">
      <p>Danza De los Caballeros 1</p>
      <audio controls>
        <source src="Prokofiev_ Romeo and Juliet, No 13 Dance of the Knights (Valery Gergiev, LSO) (1).mp3" type="audio/mpeg">
      </audio>
    </div>

    <div class="player">
      <p>Requien de Verdi(pelea)2</p>
      <audio controls>
        <source src="Verdi  - Requiem (orchestral Version).mp3" type="audio/mpeg">
      </audio>
    </div>
    
  </div>
  <h2>Europa</h2>
  <div class="players">
    <div class="player">
      <p>himno de Europa</p>
      <audio controls>
        <source src="himno a la alegria (instrumental) - el padrino mafioso.mp3" type="audio/mpeg">
      </audio>
    </div>

    <div class="player">
      <p>deh vieni alla finestra</p>
      <audio controls>
        <source src="Deh Vieni alla Finestra - Karaoke (instrumental accompaniment, lyrics and score) - Opera Karaoke (youtube).mp3" type="audio/mpeg">
      </audio>
    </div>
    
  
</body>
</html>
